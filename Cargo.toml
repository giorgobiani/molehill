[workspace]
resolver = "3"
members = ["crates/molehill-core", "crates/molehill-service", "crates/molehill"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
authors = ["Shota Giorgobiani"]
repository = "https://github.com/giorgobiani/molehill"

[workspace.dependencies]
molehill-core = { path = "crates/molehill-core" }
anyhow = "1"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "time", "macros", "process"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Com",
    "Win32_Graphics_Dwm",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Console",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
